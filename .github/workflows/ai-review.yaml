name: AI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      gemini_model:
        description: "Gemini model name"
        type: string
        required: false
        default: "gemini-2.0-flash"
      language:
        description: "Review language"
        type: string
        required: false
        default: "pt-BR"
      max_diff_chars:
        description: "Max characters of diff sent to Gemini"
        type: number
        required: false
        default: 120000
    secrets:
      GEMINI_CODE_REVIEW_API:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.pull_request != null
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Collect PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF_FILE="$RUNNER_TEMP/pr.diff"

          git fetch origin "$BASE_SHA" --depth=1 || true
          git diff --unified=3 "$BASE_SHA...$HEAD_SHA" -- \
            ':(exclude)*.lock' \
            ':(exclude)*-lock.json' \
            ':(exclude)*.min.js' \
            ':(exclude)*.min.css' \
            ':(exclude)*.map' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.webp' \
            ':(exclude)*.svg' \
            ':(exclude)*.ico' \
            ':(exclude)*.pdf' \
            ':(exclude)*.woff*' \
            ':(exclude)*.ttf' \
            > "$DIFF_FILE" || true

          if [ ! -s "$DIFF_FILE" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No textual diff to review."
            exit 0
          fi

          CHAR_COUNT="$(wc -c < "$DIFF_FILE" | tr -d ' ')"
          if [ "$CHAR_COUNT" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" "$DIFF_FILE" > "$DIFF_FILE.tmp"
            printf '\n...\n[diff truncado por tamanho]\n' >> "$DIFF_FILE.tmp"
            mv "$DIFF_FILE.tmp" "$DIFF_FILE"
          fi

          {
            echo "empty=false"
            echo "diff_file=$DIFF_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Ask Gemini for review
        id: gemini
        if: steps.diff.outputs.empty != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_CODE_REVIEW_API }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          REVIEW_LANGUAGE: ${{ inputs.language }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: ${{ steps.diff.outputs.diff_file }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/gemini_review.py"
          python3 "$RUNNER_TEMP/gemini_review.py"

      - name: Post review comment
        if: steps.diff.outputs.empty != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.REVIEW_BODY;
            if (!body) {
              core.setFailed('Review body is empty');
              return;
            }

            const marker = '## Interativa AI Code Review';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing AI review comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new AI review comment');
            }
        env:
          REVIEW_BODY: ${{ steps.gemini.outputs.review }}

      - name: Skip notice
        if: steps.diff.outputs.empty == 'true'
        run: echo "Nenhum diff textual para revisar."
