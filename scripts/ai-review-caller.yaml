name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: Interativa-group/.github/.github/workflows/ai-review.yaml@main
    secrets:
      GEMINI_CODE_REVIEW_API: ${{ secrets.GEMINI_CODE_REVIEW_API }}
    with:
      gemini_model: ${{ vars.GEMINI_MODEL != '' && vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      language: pt-BR
