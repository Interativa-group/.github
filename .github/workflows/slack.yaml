name: Slack Notify (Optional Stub)

# Stub opcional — notificação Slack desligada por padrão.
# Para ativar: chame este workflow a partir de outro job e configure
# o secret SLACK_WEBHOOK_URL no repositório ou na organização.

on:
  workflow_call:
    inputs:
      message:
        description: "Mensagem a enviar ao Slack"
        type: string
        required: true
      enabled:
        description: "Se false, o job é pulado"
        type: boolean
        required: false
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    if: inputs.enabled == true
    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL não configurado; pulando."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MESSAGE" '{text:$text}')" \
            "$SLACK_WEBHOOK_URL"
